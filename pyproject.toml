[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shot-analyzer"
version = "0.1.0"
description = "Local, model-assisted video shot and transition analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "opencv-python>=4.8", "matplotlib>=3.7", "pandas>=2.0", "scenedetect[opencv]>=0.6.4"]

[project.scripts]
shot-analyzer = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
